[project]
name = "github-issues-tracker"
version = "0.1.0"
description = "Summarize a GitHub repository's open issues from the terminal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35",
]

[project.scripts]
triage = "triage.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 80
target-version = "py310"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.isort]
# Google style: one import per line.
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names say what they check; per-test docstrings stay optional.
"test/**" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "test"]
exclude = ["^\\.claude/"]

# boto3 ships without type hints.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]
