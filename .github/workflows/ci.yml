name: CI

on:
  # Every PR, including stacked PRs that target another feature branch.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      # --locked fails if uv.lock is out of date with pyproject.toml, so CI
      # always tests the versions recorded in the lockfile.
      - name: Install project
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

      # No path argument, so mypy checks the files listed in pyproject.toml.
      - name: Type check (mypy)
        run: uv run mypy
      # The Windows-only code (msvcrt, the console's mode) is checked too.
      - name: Type check for Windows (mypy)
        run: uv run mypy --platform win32

      - name: Tests (pytest)
        run: uv run pytest

  # Menus, Tab completion and browse have Windows code paths; the runner
  # has PowerShell 7, so the PowerShell completion tests run here.
  windows:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Install project
        run: uv sync --locked --dev

      - name: Tests (pytest)
        run: uv run pytest
